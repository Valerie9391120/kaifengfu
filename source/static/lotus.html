/* —— 一键切换整套粒子颜色（颜色在约 1 秒内平滑过渡） —— */
const pal = {
  cur: null, tgt: null,                          // 各 PART_KEYS × 3 段 × rgb，共 72 个数
  neb: new Float32Array(9), nebT: new Float32Array(9),
  haze: new Float32Array(3), hazeT: new Float32Array(3),
  text: new Float32Array(3), textT: new Float32Array(3),
  A: new Float32Array(24), B: new Float32Array(24), C: new Float32Array(24)
};
function paletteToArrays(p) {
  const ramp = new Float32Array(72);
  PART_KEYS.forEach(function (key, i) { for (let s = 0; s < 3; s++) ramp.set(hexToRgb(p[key][s]), i * 9 + s * 3); });
  const neb = new Float32Array(9);
  for (let s = 0; s < 3; s++) neb.set(hexToRgb(p.nebula[s]), s * 3);
  return { ramp: ramp, neb: neb, haze: new Float32Array(hexToRgb(p.haze)), text: new Float32Array(hexToRgb(p.text)) };
}
function applyPalette(index, instant) {
  ui.palette = index;
  const p = PALETTES[index], a = paletteToArrays(p);
  pal.tgt = a.ramp; pal.nebT = a.neb; pal.hazeT = a.haze; pal.textT = a.text;
  if (instant || !pal.cur) { pal.cur = new Float32Array(a.ramp); pal.neb.set(a.neb); pal.haze.set(a.haze); pal.text.set(a.text); }
  const root = document.documentElement.style;
  root.setProperty('--accent', p.accent);
  root.setProperty('--sw-a', p.petalInner[2]); root.setProperty('--sw-b', p.petalInner[1]); root.setProperty('--sw-c', p.petalOuter[0]);
  Array.prototype.forEach.call($('colorDots').children, function (d, i) { d.setAttribute('aria-checked', i === index ? 'true' : 'false'); });
  store.set('palette', String(index));
}
function updatePalette(dt) {
  const k = 1 - Math.exp(-dt * 3.2);
  const mix = function (c, t) { for (let i = 0; i < c.length; i++) c[i] += (t[i] - c[i]) * k; };
  mix(pal.cur, pal.tgt); mix(pal.neb, pal.nebT); mix(pal.haze, pal.hazeT); mix(pal.text, pal.textT);
  for (let i = 0; i < 8; i++) {
    for (let c = 0; c < 3; c++) {
      pal.A[i * 3 + c] = pal.cur[i * 9 + c]; pal.B[i * 3 + c] = pal.cur[i * 9 + 3 + c]; pal.C[i * 3 + c] = pal.cur[i * 9 + 6 + c];
    }
  }
}
function choosePalette(index) {
  applyPalette(index, false);
  showStatus(L().colorNow(PALETTES[index].name[ui.lang]), 1800);
}

/* —— 科普面板：收起 / 展开 —— */
function setPanel(open, focus) {
  ui.panelOpen = open;
  document.body.classList.toggle('panel-open', open);
  $('panelTab').setAttribute('aria-expanded', open ? 'true' : 'false');
  updateLayout();
  if (focus) (open ? $('panelClose') : $('panelTab')).focus({ preventScroll: true });
}

function initUI() {
  PALETTES.forEach(function (p, i) {
    const d = el('button', null, 'dot');
    d.type = 'button'; d.setAttribute('role', 'radio'); d.style.setProperty('--c', p.petalInner[1]);
    d.addEventListener('click', function () { choosePalette(i); });
    $('colorDots').appendChild(d);
  });
  $('btnLang').addEventListener('click', toggleLang);
  $('btnColor').addEventListener('click', function () { choosePalette((ui.palette + 1) % PALETTES.length); });
  $('panelTab').addEventListener('click', function () { setPanel(true, true); });
  $('panelClose').addEventListener('click', function () { setPanel(false, true); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && ui.panelOpen) setPanel(false, true); });

  // 自定义命名：输入时稍作等待再更新粒子文字；清空则回到默认花名
  const input = $('nameInput');
  let timer = 0, composing = false;
  input.value = ui.customName;
  const scheduleName = function () {
    clearTimeout(timer);
    timer = setTimeout(function () {
      ui.customName = input.value.trim();
      store.set('name', ui.customName);
      if (text.shown) setNameText(ui.customName || L().defaultName);
    }, 260);
  };
  // 用拼音等输入法时，选字完成之前不更新（否则花上会先飘出一串拼音字母）
  input.addEventListener('compositionstart', function () { composing = true; clearTimeout(timer); });
  input.addEventListener('compositionend', function () { composing = false; scheduleName(); });
  input.addEventListener('input', function () { if (!composing) scheduleName(); });
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) input.blur();   // 回车收起键盘；输入法选字时的回车不算
    e.stopPropagation();
  });
  input.addEventListener('blur', function () { window.scrollTo(0, 0); });   // iOS 收起键盘后页面偶尔残留偏移，归位

  // 手机软键盘弹出时，把底部输入框顶到键盘上方
  if (window.visualViewport) {
    const vv = window.visualViewport;
    const sync = function () {
      const kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
      document.documentElement.style.setProperty('--kb', (kb > 60 ? kb : 0) + 'px');
    };
    vv.addEventListener('resize', sync); vv.addEventListener('scroll', sync);
  }
  window.addEventListener('touchstart', function () { ui.coarse = true; }, { passive: true, once: true });

  applyPalette(ui.palette, true);
  applyLang();
  // 宽屏默认展开面板；手机上默认收起，不挡花
  setPanel(!window.matchMedia('(max-width:760px) and (orientation:portrait),(max-width:560px),(max-height:520px)').matches, false);
}


/* ════════════════════════════════════════════════════════════════════════════
   ⑬ 主循环：相机 → 拨散 → 配色过渡 → 绘制
   每帧的绘制顺序：
     (1) 低清缓冲：星云              (2) 低清缓冲：辉光（大而淡的粒子）
     (3) 屏幕：把低清缓冲放大铺满     (4) 星点   (5) 花的粒子 + 微尘   (6) 命名文字
   混合方式用“滤色”(ONE, ONE_MINUS_SRC_COLOR)：与绘制顺序无关，叠得再多也只会
   柔和地趋近亮色而不会过曝成一片死白。
   ════════════════════════════════════════════════════════════════════════════ */
const clock = { time: 0, last: 0, frameDt: 0.016 };
const intro = { t: 0, done: false, started: false };
const partParams = new Float32Array(32);

function drawCount() { return Math.floor(N * quality.frac); }

function setParticleUniforms(U, t) {
  const P = CONFIG.particle, B = CONFIG.breath;
  for (let i = 0; i < 8; i++) {
    const pp = P.parts[PART_KEYS[i]];
    partParams[i * 4] = pp.size; partParams[i * 4 + 1] = pp.alpha; partParams[i * 4 + 2] = pp.twinkle; partParams[i * 4 + 3] = pp.light;
  }
  gl.uniformMatrix4fv(U.uView, false, view);
  gl.uniformMatrix4fv(U.uProj, false, proj);
  gl.uniform2f(U.uShift, shift.x, shift.y);
  gl.uniform1f(U.uTime, t);
  gl.uniform4f(U.uBreath, Math.sin(t * 6.2832 / B.period), B.scale, B.open, B.light);
  gl.uniform1f(U.uIntro, intro.done ? 1 : intro.t);
  gl.uniform1f(U.uSway, CONFIG.sway);
  gl.uniform3fv(U.uRampA, pal.A); gl.uniform3fv(U.uRampB, pal.B); gl.uniform3fv(U.uRampC, pal.C);
  gl.uniform4fv(U.uPart, partParams);
  gl.uniform3f(U.uLight, 0.33, 0.80, 0.50);
  gl.uniform3f(U.uBase, BASE[0], BASE[1], BASE[2]);
  gl.uniform4f(U.uPointer, pointer.x / W * 2 - 1, 1 - pointer.y / H * 2, W / H, pointer.glow * 0.35);
  gl.uniform1f(U.uCore, P.petalBase);
  gl.uniform1i(U.uNoise, 1);
  gl.uniform2f(U.uJit, Math.random(), Math.random());
}

function draw(dt) {
  const P = CONFIG.particle, SKY = CONFIG.sky, T = CONFIG.nameText, t = clock.time;
  const aspect = W / H;
  const pxUnit = (CH * 0.5) / cam.tanH;          // 距离为 1 时，一个世界单位对应的设备像素
  const count = drawCount();
  const offX = cam.yaw * SKY.parallax, offY = cam.pitch * SKY.parallax;
  const jx = ((Math.random() * 256) | 0) / 256, jy = ((Math.random() * 256) | 0) / 256;
  const partAttribs = G.aParticle;

  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, G.noise);
  gl.activeTexture(gl.TEXTURE0);

  /* (1) 低清缓冲：星云 */
  gl.bindFramebuffer(gl.FRAMEBUFFER, low.fbo);
  gl.viewport(0, 0, low.w, low.h);
  gl.disable(gl.BLEND);
  gl.useProgram(G.sky.p);
  useAttribs(G.aQuad);
  gl.bindTexture(gl.TEXTURE_2D, G.noise);
  let U = G.sky.U;
  const bc = project(BLOOM_CENTER[0], BLOOM_CENTER[1], BLOOM_CENTER[2]);
  gl.uniform1i(U.uNoise, 0);
  gl.uniform1f(U.uTime, t * SKY.flowSpeed);
  gl.uniform1f(U.uAspect, aspect);
  gl.uniform2f(U.uOff, offX % 2327.2727, offY);           // 2327.27 × 2.2 = 5120：三种采样尺度下噪声周期的公倍数，取模后无缝
  gl.uniform3f(U.uColA, pal.neb[0], pal.neb[1], pal.neb[2]);
  gl.uniform3f(U.uColB, pal.neb[3], pal.neb[4], pal.neb[5]);
  gl.uniform3f(U.uColC, pal.neb[6], pal.neb[7], pal.neb[8]);
  gl.uniform4f(U.uHaze, bc[0] / W, 1 - bc[1] / H, 1.75 / (2 * cam.dist * cam.tanH), SKY.haze * (intro.done ? 1 : intro.t * intro.t));
  gl.uniform3f(U.uHazeCol, pal.haze[0], pal.haze[1], pal.haze[2]);
  gl.uniform1f(U.uAmt, SKY.nebula);
  gl.uniform2f(U.uJit, jx, jy);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  /* (2) 低清缓冲：辉光 —— 取一部分粒子画得又大又淡 */
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_COLOR);
  gl.useProgram(G.particle.p);
  U = G.particle.U;
  useAttribs(partAttribs);
  setParticleUniforms(U, t);
  const glowN = Math.min(count, CONFIG.glow.count);
  if (CONFIG.glow.strength > 0 && glowN > 0) {
    const lowPx = pxUnit * low.h / CH;
    gl.uniform1f(U.uPx, lowPx);
    gl.uniform4f(U.uDraw, CONFIG.glow.size / 0.03, CONFIG.glow.strength * 130 / glowN * P.brightness, 3, Math.min(G.maxPoint, 72));   // 总亮度与发光粒子数无关
    gl.uniform4f(U.uFocus, cam.dist, 0, P.depthRange, P.depthFade);
    gl.uniform1f(U.uSoft, 1);
    gl.uniform1f(U.uEdge, 1);
    gl.drawArrays(gl.POINTS, 0, glowN);
  }

  /* (3) 屏幕：铺上低清缓冲 */
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, CW, CH);
  gl.disable(gl.BLEND);
  gl.useProgram(G.blit.p);
  useAttribs(G.aQuad);
  gl.bindTexture(gl.TEXTURE_2D, low.tex);
  gl.uniform1i(G.blit.U.uTex, 0);
  gl.uniform1i(G.blit.U.uNoise, 1);
  gl.uniform2f(G.blit.U.uJit, jx, jy);
  gl.uniform1f(G.blit.U.uGrain, SKY.grain / 255);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.enable(gl.BLEND);

  /* (4) 星点 */
  gl.useProgram(G.star.p);
  useAttribs(G.aStar);
  U = G.star.U;
  gl.uniform2f(U.uOff, offX, offY);
  gl.uniform1f(U.uAspect, aspect);
  gl.uniform1f(U.uTime, t);
  gl.uniform1f(U.uDpr, DPR);
  gl.uniform1f(U.uAmt, SKY.starBrightness);
  gl.uniform1f(U.uSoft, 0);
  gl.drawArrays(gl.POINTS, 0, starCount);

  /* (5) 花的粒子 + 环境微尘 */
  gl.useProgram(G.particle.p);
  U = G.particle.U;
  useAttribs(partAttribs);
  gl.uniform1f(U.uPx, pxUnit);
  gl.uniform4f(U.uDraw, P.size * Math.pow(cam.zoom, -P.zoomSharpen), P.brightness, 3, G.maxPoint);   // 放大时粒子长得比花慢 → 越近越细腻
  gl.uniform4f(U.uFocus, cam.dist, P.depthOfField, P.depthRange, P.depthFade);
  gl.uniform1f(U.uSoft, 0);
  gl.uniform1f(U.uEdge, 0);
  gl.drawArrays(gl.POINTS, 0, count);
  if (NT > N) gl.drawArrays(gl.POINTS, N, NT - N);

  /* (6) 命名文字 */
  if (text.shown) {
    gl.useProgram(G.text.p);
    useAttribs(G.aText);
    U = G.text.U;
    // 锚点 = 花心在视空间的位置，再沿屏幕“向上”抬到花朵顶端之上。
    // 这样无论平视还是俯视，文字都悬在花的上方，而不会压在花上。
    const br = 1 + CONFIG.breath.scale * Math.sin(t * 6.2832 / CONFIG.breath.period);          // 跟随整株的呼吸缩放
    const bx = BASE[0] + (BLOOM_CENTER[0] - BASE[0]) * br, by = BASE[1] + (BLOOM_CENTER[1] - BASE[1]) * br, bz = BASE[2] + (BLOOM_CENTER[2] - BASE[2]) * br;
    const sp = Math.abs(Math.sin(cam.pitch)), cp = Math.cos(cam.pitch);
    const rise = Math.hypot(BLOOM_HALF_H * cp, BLOOM_RADIUS * sp);                              // 当前视角下，花朵顶端高出花心多少
    let k = clamp((Math.abs(cam.pitch) - 0.5) / 0.55, 0, 1); k = k * k * (3 - 2 * k);
    const lift = rise + lerp(T.gap, T.gapSteep, k) + Math.sin(t * 0.8) * 0.035;                  // 末项：文字自身轻轻浮动
    gl.uniformMatrix4fv(U.uProj, false, proj);
    gl.uniform2f(U.uShift, shift.x, shift.y);
    gl.uniform3f(U.uAnchor,
      view[0] * bx + view[4] * by + view[8] * bz + view[12],
      view[1] * bx + view[5] * by + view[9] * bz + view[13] + lift,
      view[2] * bx + view[6] * by + view[10] * bz + view[14]);
    gl.uniform1f(U.uMorph, text.morph);
    gl.uniform1f(U.uTime, t);
    gl.uniform1f(U.uPx, pxUnit);
    gl.uniform4f(U.uDraw, T.size, T.alpha, 3, G.maxPoint);
    gl.uniform3f(U.uColor, pal.text[0], pal.text[1], pal.text[2]);
    gl.uniform1f(U.uSoft, 0);
    gl.drawArrays(gl.POINTS, 0, text.n);
  }
}

/* 帧率持续偏低时自动降一档画质（降低渲染分辨率 + 少画一部分粒子） */
function adaptQuality() {
  if (forcedQuality !== undefined || quality.level >= QUALITY.length - 1) return;
  const real = clock.frameDt;                             // 真实帧间隔
  if (quality.warm < 1.5) { quality.warm += real; return; }   // 刚启动 / 刚降档：先等画面稳定
  quality.acc += real; quality.frames++;
  if (quality.acc >= 1.6 && quality.frames >= 6) {
    if (quality.acc / quality.frames > 0.038) {           // 平均低于约 26 帧/秒 → 降一档（30 帧封顶的省电模式不会误判）
      quality.level++;
      quality.scale = QUALITY[quality.level].scale; quality.frac = QUALITY[quality.level].frac;
      quality.warm = 0.6;
      resize();
    }
    quality.acc = 0; quality.frames = 0;
  }
}

function frame(ms) {
  requestAnimationFrame(frame);
  if (!G.ready) return;
  const now = ms / 1000;
  const dt = clamp(now - clock.last, 0.001, 0.05);       // 限制步长：切回标签页时不会一下子跳很远
  clock.frameDt = clamp(now - clock.last, 0.001, 0.5);    // 真实帧间隔（用于判断“是否停住再松手”）
  clock.last = now; clock.time += dt;

  if (intro.started && !intro.done) {
    intro.t += dt / CONFIG.introDuration;
    if (!text.shown && intro.t > 0.62) { text.shown = true; setNameText(ui.customName || L().defaultName); }
    if (intro.t >= 1) intro.done = true;
  }
  text.morph = Math.min(1, text.morph + dt / 1.5);
  if (!ui.zoomTipShown && cam.zoom > 1.7) {               // 第一次放大到花占大半屏：提示一次怎样在没有空白处时旋转
    ui.zoomTipShown = true;
    showStatus(ui.coarse ? L().zoomTipTouch : L().zoomTipMouse, 5200);
  }
  pointer.glow += ((pointer.has && !pointer.touch && intro.done ? 1 : 0) - pointer.glow) * (1 - Math.exp(-dt * 6));

  updateCamera(dt, now);
  processPointer(dt, now);
  if (stepScatter(dt, now)) { gl.bindBuffer(gl.ARRAY_BUFFER, G.bOff); gl.bufferSubData(gl.ARRAY_BUFFER, 0, off); }
  updatePalette(dt);
  draw(dt);
  adaptQuality();
}

/* —— 启动：模型加载提示 → 解码 → 建缓冲 → 加载完成提示 → 入场 —— */
async function boot() {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    CONFIG.introDuration = 1.4; CONFIG.sway *= 0.4;        // 系统开启“减少动态效果”：入场从简、摇曳更轻（自动旋转是本页的核心功能，保留）
  }
  initUI();
  if (!gl) { $('loader').hidden = true; $('fallback').hidden = false; return; }
  if (forcedQuality !== undefined) { const q = QUALITY[clamp(+forcedQuality, 0, QUALITY.length - 1)]; quality.scale = q.scale; quality.frac = q.frac; }
  const setProgress = function (p) {
    $('loaderFill').style.transform = 'scaleX(' + p.toFixed(3) + ')';
    $('loaderText').textContent = L().loading + ' ' + Math.round(p * 100) + '%';
  };
  setProgress(0.02);
  await nextFrame();
  try {
    const cloud = await decodeCloud($('lotus-cloud').textContent, function (p) { setProgress(0.04 + p * 0.66); });
    setProgress(0.74); await nextFrame();
    buildParticles(cloud);
    setProgress(0.88); await nextFrame();
    initGL();
    setProgress(1); await nextFrame();
  } catch (err) {
    $('loaderText').textContent = String(err && err.message || err);
    throw err;
  }
  const doneText = L().loaded(N.toLocaleString('en-US'));
  $('loaderText').textContent = doneText;                 // 加载完成提示
  await sleep(700);
  $('loader').classList.add('done');
  document.body.classList.remove('loading');
  document.body.classList.add('ready');
  intro.started = true;
  clock.last = performance.now() / 1000;
  requestAnimationFrame(frame);
  await sleep(1300);
  showStatus(doneText, 2600);
  ui.hintTimer = setTimeout(showHint, 3000);
}

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function () { setTimeout(resize, 250); });
canvas.addEventListener('webglcontextlost', function (e) { e.preventDefault(); G.ready = false; });
canvas.addEventListener('webglcontextrestored', function () { initGL(); });

/* 给爱折腾的人留个入口：在控制台里改 LOTUS.CONFIG 的数值可即时生效 */
window.LOTUS = { CONFIG: CONFIG, PALETTES: PALETTES, I18N: I18N, cam: cam, pointer: pointer, quality: quality,
  stats: function () { return { particles: N, total: NT, scattered: activeCount, quality: quality.level, dpr: DPR, canvas: [CW, CH], intro: intro.t, time: clock.time, yaw: cam.yaw, pitch: cam.pitch, auto: cam.auto, zoom: cam.zoom, zoomTarget: cam.zoomTarget, pan: cam.pan.slice(), mode: pointer.mode, morph: text.morph, shift: [shift.x, shift.y] }; },
  setName: function (s) { ui.customName = s; setNameText(s || L().defaultName); },
  setPalette: choosePalette, project: project };

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
